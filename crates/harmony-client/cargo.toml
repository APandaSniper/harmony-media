[package]
name = "harmony-client"
version.workspace = true
edition.workspace = true

[dependencies]
harmony-core = { path = "../harmony-core" }
dioxus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = {workspace = true}

# Web (WASM) - NO native-tls or openssl!
[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus-web = "*"
reqwest = { version = "*", default-features = false, features = ["json"] }  # No TLS features at all for WASM
web-sys = { version = "*", features = ["Window", "Location"] }

# Desktop
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus-desktop = "*"
reqwest = { version = "*", default-features = false, features = ["json", "rustls-tls"] }  # Use rustls, not native-tls
tokio = { workspace = true, features = ["rt", "macros"] }
webbrowser = "*"